name: Simple Collector (ConfigsHUB only)

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r config/requirements.txt

      - name: Run Telegram Collector
        run: python src/telegram_collector.py

      - name: Merge all configs into all_servers.txt
        run: |
          > all_servers.txt
          if [ -d "servers" ]; then
            for file in servers/*; do
              if [ -f "$file" ]; then
                cat "$file" >> all_servers.txt
                echo "" >> all_servers.txt
              fi
            done
          fi
          echo "✅ Total lines: $(wc -l < all_servers.txt)"

      - name: Split joined proxy links
        run: |
          if [ -f all_servers.txt ]; then
            python src/split_links.py all_servers.txt
          fi

      - name: Advanced dedup configs
        run: |
          if [ -f all_servers.txt ]; then
            python src/dedup_configs.py all_servers.txt
          fi

      - name: Rebuild protocol files
        run: python src/rebuild_protocols.py

      - name: Commit and push updated files
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          mkdir -p servers data
          touch all_servers.txt
          git add -A all_servers.txt servers/ data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🔄 Update configs from ConfigsHUB [skip ci]"
            git push
          fi
