name: Simple Collector (ConfigsHUB only)

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r config/requirements.txt

      - name: Run Telegram Collector
        run: python src/telegram_collector.py

      - name: Export last 50 configs to all_servers.txt
        run: |
          python - <<'PY'
          import sqlite3, os

          # اگر دیتابیس نبود، فایل قبلی را دست نزن
          if not os.path.exists('collector.db'):
              print('⚠️ collector.db not found — keeping existing all_servers.txt')
              raise SystemExit(0)

          conn = sqlite3.connect('collector.db')
          rows = conn.execute(
              'SELECT config FROM configs ORDER BY rowid DESC LIMIT 50'
          ).fetchall()

          # اگر دیتابیس خالی بود، فایل قبلی را دست نزن
          if not rows:
              print('⚠️ No configs in DB — keeping existing all_servers.txt')
              conn.close()
              raise SystemExit(0)

          # نگهداری فقط ۵۰۰ کانفیگ آخر در DB (جلوگیری از رشد بی‌رویه)
          conn.execute(
              'DELETE FROM configs WHERE id NOT IN '
              '(SELECT id FROM configs ORDER BY rowid DESC LIMIT 500)'
          )
          conn.commit()
          conn.close()

          # نوشتن ۵۰ کانفیگ آخر در all_servers.txt (mode 'w' = overwrite)
          with open('all_servers.txt', 'w', encoding='utf-8') as f:
              for (cfg,) in rows:
                  cfg = (cfg or '').strip()
                  if cfg:
                      f.write(cfg + '\n')

          print(f'✅ Wrote {len(rows)} configs (last 50) to all_servers.txt')
          PY

      - name: Clean servers/ and rebuild protocol files
        run: |
          rm -rf servers
          mkdir -p servers
          python src/rebuild_protocols.py

      - name: Commit and push updated files
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          mkdir -p servers data
          touch all_servers.txt
          git add -A all_servers.txt servers/ data/ collector.db 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🔄 Update configs from ConfigsHUB (last 50) [skip ci]"
            git push
          fi
